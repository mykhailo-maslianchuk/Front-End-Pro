<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Create</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
  <body>
  <div class="container mt-5">
    <h1 class="mb-4 text-center">Створити товар</h1>
    <form id="productForm">
      <div class="mb-3">
        <label for="title" class="form-label">Назва товару</label>
        <input type="text" class="form-control" id="title" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Опис</label>
        <textarea class="form-control" id="description" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Ціна</label>
        <input type="number" class="form-control" id="price" min="0" required>
      </div>
      <button type="submit" class="btn btn-primary">Створити товар</button>
    </form>
  </div>

  <script src="./js/create.js"></script>
  </body>
</html>
