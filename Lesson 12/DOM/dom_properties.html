<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Object Model Properties</title>
  <script src="js/dom_properties.js" defer></script>
  <style>
    #myDiv {
      padding: 10px;
      background-color: #f0f0f0;
      margin-top: 10px;
    }
    .new-class {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
<h1>Робота з DOM властивостями</h1>

<label for="myInput">Текстове поле:</label>
<input id="myInput" type="text" value="Початковий текст" />

<br/>
<br/>

<label for="myCheckbox">Чекбокс:</label>
<input id="myCheckbox" type="checkbox" />

<div id="myDiv" class="old-class">Цей текст у div</div>

</body>
</html>
