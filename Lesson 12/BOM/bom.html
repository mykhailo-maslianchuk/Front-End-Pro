<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Browser Object Model</title>
    <script src="js/bom.js" defer></script>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button onclick="window.location.reload()">Перезавантажити сторінку</button>
    <button onclick="window.history.back()">Назад</button>
    <button onclick="window.history.forward()">Вперед</button>
    <button id="openWindowBtn">Відкрити нове вікно</button>
    <button id="closeWindowBtn">Закрити нове вікно</button>
</body>
</html>
