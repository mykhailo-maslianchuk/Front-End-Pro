<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editing</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div class="container">
  <h1>Редагування завдання</h1>
  <form id="edit-form">
    <label for="edit-title">Назва:</label>
    <input type="text" id="edit-title" required />

    <label for="edit-description">Опис:</label>
    <textarea id="edit-description" rows="4"></textarea>

    <label for="edit-deadline">Дедлайн:</label>
    <input type="date" id="edit-deadline" />

    <button type="submit">Зберегти</button>
  </form>
  <button onclick="window.location.href='index.html'">⬅ Назад</button>
</div>

<script src="./js/edit.js"></script>
</body>
</html>
